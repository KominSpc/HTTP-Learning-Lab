<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>标签练习</title>
  <style>
    :root {
      --bg: #1a1d23;
      --panel-bg: #21252b;
      --border: #3a3f4b;
      --text: #e1e4e8;
      --text-secondary: #959da5;
      --accent: #61afef;
      --accent2: #c678dd;
      --container-color: #4a90d9;
      --container-bg: rgba(74, 144, 217, 0.12);
      --container-border: #4a90d9;
      --double-color: #56b6c2;
      --double-bg: rgba(86, 182, 194, 0.1);
      --double-border: #56b6c2;
      --single-color: #e5c07b;
      --single-bg: rgba(229, 192, 123, 0.1);
      --single-border: #e5c07b;
      --error-color: #e06c75;
      --error-bg: rgba(224, 108, 117, 0.15);
      --error-border: #e06c75;
      --drop-zone-bg: rgba(97, 175, 239, 0.08);
      --help-btn-glow: #f0a500;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    .app-container {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* 左侧面板 */
    .sidebar {
      width: 300px;
      min-width: 300px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .sidebar-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar-tab {
      flex: 1;
      padding: 12px 4px;
      text-align: center;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8em;
      color: var(--text-secondary);
      transition: 0.2s;
      border-bottom: 2px solid transparent;
      background: rgba(255, 255, 255, 0.02);
    }

    .sidebar-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: rgba(97, 175, 239, 0.08);
    }

    .sidebar-panels {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .tab-panel {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      flex-direction: column;
      gap: 14px;
    }

    .tab-panel.active {
      display: flex;
    }

    .sidebar-header {
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header h2 {
      font-size: 1.2em;
      color: var(--accent);
    }

    .tag-library-inner {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .tag-category {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 10px;
      padding: 12px 10px;
    }

    .tag-category-title {
      font-size: 0.7em;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cat-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .cat-dot.container {
      background: var(--container-color);
    }

    .cat-dot.double {
      background: var(--double-color);
    }

    .cat-dot.single {
      background: var(--single-color);
    }

    .cat-dot.error {
      background: var(--error-color);
      animation: error-pulse 1.5s infinite;
    }

    @keyframes error-pulse {

      0%,
      100% {
        box-shadow: 0 0 6px var(--error-color);
      }

      50% {
        box-shadow: 0 0 16px var(--error-color);
      }
    }

    .tag-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .draggable-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 13px;
      border-radius: 20px;
      font-size: 0.82em;
      font-weight: 600;
      cursor: grab;
      border: 2px solid transparent;
      font-family: monospace;
      transition: 0.2s;
      white-space: nowrap;
    }

    .draggable-tag:active {
      cursor: grabbing;
      transform: scale(0.94);
    }

    .draggable-tag.tag-container {
      background: var(--container-bg);
      border-color: var(--container-border);
      color: #6db9f7;
    }

    .draggable-tag.tag-double {
      background: var(--double-bg);
      border-color: var(--double-border);
      color: #6cd5e0;
    }

    .draggable-tag.tag-single {
      background: var(--single-bg);
      border-color: var(--single-border);
      color: #e8c97a;
      border-style: dashed;
    }

    .draggable-tag.tag-error {
      background: var(--error-bg);
      border-color: var(--error-border);
      color: #f0888e;
      border-style: dotted;
    }

    .preset-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      transition: 0.2s;
      margin-bottom: 10px;
    }

    .preset-card:hover {
      border-color: var(--accent2);
      background: rgba(198, 120, 221, 0.08);
    }

    .preset-card h4 {
      font-size: 0.85em;
      color: var(--accent2);
      margin-bottom: 4px;
    }

    .preset-card p {
      font-size: 0.7em;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .preset-preview {
      font-family: monospace;
      font-size: 0.65em;
      color: #abb2bf;
      background: #2a2d34;
      padding: 6px 8px;
      border-radius: 6px;
      margin-top: 6px;
      white-space: pre-wrap;
      max-height: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .style-section {
      margin-bottom: 16px;
    }

    .style-section h4 {
      font-size: 0.8em;
      color: var(--accent2);
      margin-bottom: 6px;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 4px;
    }

    .style-btn-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .style-btn {
      padding: 5px 10px;
      font-size: 0.7em;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      font-family: monospace;
      transition: 0.2s;
    }

    .style-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--accent2);
    }

    .color-swatch {
      display: inline-block;
      width: 18px;
      height: 18px;
      border-radius: 4px;
      vertical-align: middle;
      margin-right: 4px;
      border: 1px solid #888;
    }

    .input-group {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 4px;
    }

    .input-group input,
    .input-group select {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #2a2d34;
      color: #fff;
      font-size: 0.75em;
    }

    .color-picker-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      padding: 6px 8px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
    }

    .color-picker-row label {
      font-size: 0.7em;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .color-picker-row input[type="color"] {
      width: 36px;
      height: 28px;
      border: 2px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
      padding: 1px;
    }

    .color-picker-row input[type="color"]:hover {
      border-color: var(--accent2);
    }

    .color-picker-row .current-color-display {
      display: inline-block;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: 1px solid #888;
      vertical-align: middle;
    }

    .build-area-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #1e2128;
    }

    .build-header {
      padding: 16px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .build-header h3 {
      white-space: nowrap;
    }

    .build-header .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .build-canvas {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
    }

    .drop-zone-root {
      min-height: 350px;
      border: 2px dashed rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 16px;
      transition: 0.2s;
    }

    .drop-zone-root.drag-over {
      border-color: var(--accent);
      background: var(--drop-zone-bg);
    }

    .placeholder-text {
      text-align: center;
      color: var(--text-secondary);
      padding: 60px 20px;
    }

    .build-tag-block {
      position: relative;
      margin: 8px 0;
      border-radius: 10px;
      transition: 0.2s;
      outline: none;
    }

    .build-tag-block.selected {
      box-shadow: 0 0 0 2px var(--accent2);
    }

    .drop-highlight-above::before {
      content: '';
      position: absolute;
      top: -3px;
      left: 8px;
      right: 8px;
      height: 3px;
      background: var(--accent);
      border-radius: 3px;
      z-index: 30;
      animation: highlight-bar 0.6s ease-in-out infinite;
    }

    .drop-highlight-below::after {
      content: '';
      position: absolute;
      bottom: -3px;
      left: 8px;
      right: 8px;
      height: 3px;
      background: var(--accent);
      border-radius: 3px;
      z-index: 30;
      animation: highlight-bar 0.6s ease-in-out infinite;
    }

    @keyframes highlight-bar {

      0%,
      100% {
        opacity: 0.7;
      }

      50% {
        opacity: 1;
      }
    }

    .tag-open,
    .tag-close,
    .tag-body {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      font-family: monospace;
      font-size: 0.85em;
      font-weight: 600;
      border: 2px solid transparent;
      transition: 0.2s;
      background: rgba(255, 255, 255, 0.03);
    }

    .tag-open.type-container,
    .tag-close.type-container {
      background: var(--container-bg);
      border-color: var(--container-border);
      color: #8ec8f7;
    }

    .tag-body.type-double {
      background: var(--double-bg);
      border-color: var(--double-border);
      color: #7de0eb;
    }

    .tag-body.type-single {
      background: var(--single-bg);
      border-color: var(--single-border);
      color: #edcf85;
      border-style: dashed;
    }

    .tag-body.type-error {
      background: var(--error-bg);
      border-color: var(--error-border);
      color: #f49ca2;
      border-style: dotted;
    }

    .tag-content {
      display: inline-block;
      min-width: 30px;
      padding: 2px 8px;
      border-bottom: 2px dashed #888;
      color: #f0f0f0;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      cursor: text;
      font-family: inherit;
      font-size: 0.9em;
      outline: none;
    }

    .tag-content:empty::before {
      content: '点击输入内容';
      color: #777;
    }

    .style-tag-wrapper {
      display: block;
      margin: 4px 0;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #e5c07b;
      background: #1e1e2e;
    }

    .style-tag-header {
      background: #2a2a3a;
      padding: 6px 12px;
      font-size: 0.8em;
      color: #e5c07b;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: monospace;
    }

    .style-tag-header .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .style-tag-header .dot.red {
      background: #e06c75;
    }

    .style-tag-header .dot.yellow {
      background: #e5c07b;
    }

    .style-tag-header .dot.green {
      background: #98c379;
    }

    .style-code-area {
      padding: 10px 14px;
      font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      font-size: 0.82em;
      line-height: 1.7;
      color: #cdd6f4;
      min-height: 40px;
      white-space: pre-wrap;
      word-break: break-all;
      outline: none;
      background: #1e1e2e;
      cursor: text;
    }

    .style-code-area:empty::before {
      content: '/* 这里写 CSS 代码，例如：\A.我的样式 { color: red; } */';
      color: #6c7086;
      white-space: pre;
    }

    .css-selector {
      color: #c678dd;
    }

    .css-property {
      color: #61afef;
    }

    .css-value {
      color: #e5c07b;
    }

    .css-punctuation {
      color: #abb2bf;
    }

    .css-comment {
      color: #6c7086;
      font-style: italic;
    }

    .attr-editor {
      display: inline-block;
      min-width: 40px;
      padding: 2px 6px;
      border-bottom: 2px dashed #888;
      color: #f0f0f0;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      cursor: text;
      font-family: monospace;
      font-size: 0.8em;
      outline: none;
      margin: 0 4px;
    }

    .attr-editor:empty::before {
      content: attr(data-placeholder);
      color: #777;
    }

    .attr-editor.src-ellipsis {
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .delete-btn {
      opacity: 0;
      transition: 0.2s;
      cursor: pointer;
      font-size: 0.85em;
      padding: 2px 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #ccc;
    }

    .tag-open:hover .delete-btn,
    .tag-body:hover .delete-btn {
      opacity: 1;
    }

    .delete-btn:hover {
      background: var(--error-color);
      color: #fff;
    }

    .tag-class-badge {
      display: inline-block;
      background: rgba(198, 120, 221, 0.2);
      color: #c678dd;
      font-size: 0.7em;
      padding: 1px 6px;
      border-radius: 6px;
      margin-left: 4px;
      font-weight: normal;
      font-family: monospace;
      vertical-align: middle;
    }

    .container-children {
      margin-left: 28px;
      padding: 10px 14px;
      border-left: 3px solid var(--container-border);
      border-radius: 0 10px 10px 0;
      min-height: 28px;
      background: rgba(74, 144, 217, 0.03);
      transition: 0.2s;
    }

    .container-children.drop-highlight-inside {
      background: var(--drop-zone-bg) !important;
      border-left-color: var(--accent) !important;
    }

    .inner-placeholder {
      color: var(--text-secondary);
      font-size: 0.75em;
      font-style: italic;
      padding: 8px 10px;
      opacity: 0.5;
    }

    .preview-panel {
      width: 360px;
      min-width: 360px;
      background: var(--panel-bg);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .preview-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .code-preview-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      font-family: monospace;
      font-size: 0.75em;
      background: #1a1d23;
      color: #abb2bf;
      max-height: 45%;
      white-space: pre-wrap;
    }

    .render-preview-area {
      flex: 1;
      background: #fff;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .render-iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #fff;
    }

    .btn {
      padding: 8px 15px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      cursor: pointer;
      font-size: 0.8em;
      font-weight: 600;
      transition: 0.2s;
      white-space: nowrap;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .btn.btn-accent {
      background: rgba(97, 175, 239, 0.2);
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn.btn-small {
      padding: 4px 10px;
      font-size: 0.7em;
    }

    /* ========== 标签帮助按钮 - 显眼样式 ========== */
    .btn.btn-help {
      background: linear-gradient(135deg, rgba(240, 165, 0, 0.3), rgba(255, 180, 30, 0.2));
      border-color: #f0a500;
      color: #ffd066;
      font-weight: 700;
      font-size: 0.82em;
      letter-spacing: 0.5px;
      position: relative;
      box-shadow: 0 0 14px rgba(240, 165, 0, 0.25);
      animation: help-btn-glow 2.5s ease-in-out infinite;
    }

    .btn.btn-help:hover {
      background: linear-gradient(135deg, rgba(240, 165, 0, 0.5), rgba(255, 190, 40, 0.35));
      border-color: #ffc040;
      color: #ffe8a0;
      box-shadow: 0 0 22px rgba(240, 165, 0, 0.45);
      transform: translateY(-1px);
    }

    @keyframes help-btn-glow {

      0%,
      100% {
        box-shadow: 0 0 10px rgba(240, 165, 0, 0.2);
      }

      50% {
        box-shadow: 0 0 22px rgba(240, 165, 0, 0.45), 0 0 36px rgba(255, 180, 30, 0.18);
      }
    }

    /* ========== 帮助弹窗 Modal ========== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-dialog {
      background: #252830;
      border: 1px solid var(--border);
      border-radius: 18px;
      width: 92vw;
      max-width: 880px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      transform: translateY(20px);
      transition: transform 0.3s ease;
      overflow: hidden;
    }

    .modal-overlay.active .modal-dialog {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 12px;
    }

    .modal-header h2 {
      font-size: 1.2em;
      color: #ffd066;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .modal-close {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: #ccc;
      cursor: pointer;
      font-size: 1.1em;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .modal-close:hover {
      background: var(--error-color);
      color: #fff;
      border-color: var(--error-color);
    }

    .modal-filter-row {
      display: flex;
      gap: 8px;
      padding: 12px 22px;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      flex-shrink: 0;
    }

    .modal-filter-btn {
      padding: 6px 14px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.75em;
      font-weight: 600;
      transition: 0.2s;
      white-space: nowrap;
    }

    .modal-filter-btn.active,
    .modal-filter-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-color: #888;
    }

    .modal-filter-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(97, 175, 239, 0.15);
    }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 22px 22px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
      align-content: start;
    }

    /* 帮助卡片 */
    .help-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: 0.2s;
    }

    .help-card:hover {
      border-color: rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.06);
    }

    .help-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .help-tag-name {
      font-family: 'Fira Code', 'Consolas', monospace;
      font-weight: 700;
      font-size: 0.95em;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);

        desc: '️ 常见错误：标签名缺少尖括号，如写成 p&gt; 而非 &lt;p&gt;，浏览器无法识别。<br><br> 可以想象为写标签时忘记戴“帽子”（&lt;）或“鞋子”（&gt;），浏览器会看不懂，把它当成普通文字。',
        demoHTML: '<span style="color:#e06c75;"> i&gt;完蛋，这下斜体显示不出来了&lt;/i&gt;</span>'
      },
      {
        tag: 'a',
        display: 'a',
        category: 'double',
        desc: '超链接标签，用于跳转到其他页面或网站。通过 href 属性设置目标地址。<br><br> 就像网页上的“传送门”，点击它就能跳转到另一个地方，比如“点击这里”。',
        demoHTML: '<a href="https://example.com" style="color:#61afef;"> 点击跳转到示例网站</a>'
      },
      ];

      function createTagElement(tag, type, display, error = null) {
        const el = document.createElement('div');
        el.className = 'draggable-tag tag-' + (type === 'error' ? 'error' : type);
        el.draggable = true;
        el.dataset.tag = tag;
        el.dataset.type = type;
        el.dataset.display = display;
        if (error) el.dataset.error = error;
        el.innerHTML = type === 'single' ? `&lt;${display} /&gt;` : `&lt;${display}&gt;`;
        if (error) el.innerHTML = '️ ' + el.innerHTML;
        return el;
      }

      function populateTags() {
        ['container', 'double', 'single', 'error'].forEach(cat => {
          const grid = document.getElementById(cat + 'Tags');
          if (!grid) return;
          grid.innerHTML = '';
          tagsData[cat].forEach(t => grid.appendChild(createTagElement(t.tag, cat, t.display, t
            .error || null)));
        });
      }
      populateTags();

      function bindLibraryDrag() {
        document.querySelectorAll('.draggable-tag').forEach(el => {
          el.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('application/json', JSON.stringify({
              tag: el.dataset.tag,
              type: el.dataset.type,
              display: el.dataset.display,
              error: el.dataset.error || null,
              source: 'library'
            }));
            e.dataTransfer.effectAllowed = 'copy';
          });
          el.addEventListener('dblclick', () => {
            addTagToRoot(el.dataset.tag, el.dataset.type, el.dataset.display, el.dataset
              .error || null);
          });
        });
      }
      bindLibraryDrag();

      function createNode(tagName, type, displayName, errorType = null) {
        const node = {
          id: ++nodeIdCounter,
          tagName,
          type,
          displayName: displayName || tagName,
          errorType,
          children: type === 'container' ? [] : null,
          content: (type === 'double' && tagName === 'style') ? '' : (type === 'double' ? '内容' : ''),
          style: {},
          animClass: '',
          classPrefix: 'cla-' + randomString(8),
          animClassPrefix: null,
          attributes: {}
        };
        if (type === 'single' && ['img', 'video', 'audio'].includes(tagName)) {
          node.attributes.src = '';
          node.attributes.width = '';
          node.attributes.height = '';
        } else if (tagName === 'a') {
          node.attributes = { href: '' };
        }
        return node;
      }

      const rootDropZone = document.getElementById('rootDropZone');
      const codePreview = document.getElementById('codePreview');
      const renderFrame = document.getElementById('renderFrame');
      const toast = document.getElementById('toast');
      const tabBtns = document.querySelectorAll('.sidebar-tab');

      tabBtns.forEach(tab => {
        tab.addEventListener('click', () => {
          const target = tab.dataset.tab;
          tabBtns.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
          document.getElementById('panel-' + target).classList.add('active');
          if (target === 'styles' && selectedNodeId) renderStylePanel();
          if (target === 'presets') renderPresetsPanel();
        });
      });

      function showToast(msg, type = '') {
        toast.textContent = msg;
        toast.className = 'toast ' + (type || '');
        requestAnimationFrame(() => toast.classList.add('show'));
        clearTimeout(window._toastTimer);
        window._toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
      }

      function escapeHTML(str) {
        const d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
      }

      function getNodeClasses(node) {
        const classes = [];
        if (node.style && Object.keys(node.style).length) classes.push(node.classPrefix);
        if (node.animClassPrefix) classes.push(node.animClassPrefix);
        return classes.length ? classes.join(' ') : '';
      }

      function findStyleNodes(nodes, result = []) {
        for (const n of nodes) {
          if (n.tagName === 'style') result.push(n);
          if (n.children) findStyleNodes(n.children, result);
        }
        return result;
      }

      function getAllCSSRules() {
        const rules = [];

        function walk(nodes) {
          for (const n of nodes) {
            if (n.style && Object.keys(n.style).length) {
              const props = Object.entries(n.style).map(([k, v]) => `${k}:${v};`).join(' ');
              rules.push(`.${n.classPrefix} { ${props} }`);
            }
            if (n.animClassPrefix && n.animClass) {
              rules.push(`.${n.animClassPrefix} { animation: ${n.animClass}; }`);
            }
            if (n.children) walk(n.children);
          }
        }
        walk(treeData);
        return rules;
      }

      function updateStyleNodes() {
        const rules = getAllCSSRules();
        const cssText = rules.join('\n');
        const styleNodes = findStyleNodes(treeData);
        styleNodes.forEach(n => { n.content = cssText; });
      }

      function highlightCSS(code) {
        if (!code || !code.trim()) return '';
        let html = escapeHTML(code);
        html = html.replace(/(\/\*[\s\S]*?\*\/)/g,
          '<span class="css-comment">$1</span>');
        html = html.replace(/^([^{]+)(\{)/gm,
          '<span class="css-selector">$1</span><span class="css-punctuation">$2</span>');
        html = html.replace(/(\{|;)\s*([a-zA-Z-]+)\s*:/g,
          '$1 <span class="css-property">$2</span><span class="css-punctuation">:</span>');
        html = html.replace(/:\s*([^;{}]+)([;}])/g,
          '<span class="css-punctuation">:</span> <span class="css-value">$1</span><span class="css-punctuation">$2</span>'
        );
        return html;
      }

      function renderBuildArea() {
        rootDropZone.innerHTML = '';
        if (treeData.length === 0) {
          rootDropZone.classList.remove('has-content');
          rootDropZone.innerHTML =
            '<div class="placeholder-text"><span style="font-size:2em;"></span><br>将左侧标签拖到这里，或使用预设模板</div>';
        } else {
          rootDropZone.classList.add('has-content');
          treeData.forEach(node => rootDropZone.appendChild(renderNodeBlock(node, 0)));
        }
        updateCodePreview();
        updateRenderPreview();
        if (selectedNodeId) {
          const selBlock = rootDropZone.querySelector(`[data-node-id="${selectedNodeId}"]`);
          if (selBlock) selBlock.classList.add('selected');
        }
      }

      function renderNodeBlock(node, depth) {
        const block = document.createElement('div');
        block.className = 'build-tag-block';
        block.dataset.nodeId = node.id;
        block.draggable = false;

        block.addEventListener('click', (e) => {
          e.stopPropagation();
          selectNode(node.id);
        });

        const nodeClasses = getNodeClasses(node);
        let classBadge = '';
        if (nodeClasses && node.tagName !== 'style') {
          classBadge = `<span class="tag-class-badge">.${nodeClasses.replace(/ /g, ' .')}</span>`;
        }

        if (node.tagName === 'style' && node.type === 'double') {
          block.innerHTML = `
                <div class="style-tag-wrapper">
                    <div class="style-tag-header">
                        <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
                        &lt;style&gt;  CSS 样式表
                        <button class="delete-btn" style="opacity:1;margin-left:auto;">×</button>
                    </div>
                    <div class="style-code-area" contenteditable="true">${highlightCSS(node.content)}</div>
                    <div style="background:#2a2a3a;padding:4px 12px;font-size:0.7em;color:#e5c07b;font-family:monospace;">&lt;/style&gt;</div>
                </div>`;
          const delBtn = block.querySelector('.delete-btn');
          delBtn.onclick = (e) => {
            e.stopPropagation();
            deleteNode(node.id);
          };
          const codeArea = block.querySelector('.style-code-area');
          codeArea.addEventListener('input', () => {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = codeArea.innerHTML;
            node.content = tempDiv.innerText;
            updateRenderPreview();
            updateCodePreview();
          });
          codeArea.addEventListener('blur', () => {
            codeArea.innerHTML = highlightCSS(node
              .content);
          });
          codeArea.addEventListener('focus', () => { codeArea.innerText = node.content; });
          return block;
        }

        if (node.type === 'container') {
          const openTag = document.createElement('span');
          openTag.className = 'tag-open type-container';
          openTag.innerHTML =
            `&lt;<strong>${escapeHTML(node.displayName)}</strong>&gt;  ${classBadge}`;
          const delBtn = document.createElement('button');
          delBtn.className = 'delete-btn';
          delBtn.textContent = '×';
          delBtn.onclick = (e) => {
            e.stopPropagation();
            deleteNode(node.id);
          };
          openTag.appendChild(delBtn);
          block.appendChild(openTag);

          const childrenArea = document.createElement('div');
          childrenArea.className = 'container-children';
          childrenArea.dataset.parentNodeId = node.id;
          if (node.children && node.children.length > 0) {
            childrenArea.classList.add('has-children');
            node.children.forEach(child => childrenArea.appendChild(renderNodeBlock(child,
              depth + 1)));
          } else {
            childrenArea.innerHTML =
              '<span class="inner-placeholder"> 拖入标签到内部</span>';
          }
          block.appendChild(childrenArea);

          const closeTag = document.createElement('span');
          closeTag.className = 'tag-close type-container';
          closeTag.innerHTML = `&lt;/<strong>${escapeHTML(node.displayName)}</strong>&gt;`;
          block.appendChild(closeTag);
        } else {
          const body = document.createElement('span');
          body.className = 'tag-body type-' + node.type;
          body.innerHTML = buildTagBodyHTML(node) + classBadge;
          const delBtn = document.createElement('button');
          delBtn.className = 'delete-btn';
          delBtn.textContent = '×';
          delBtn.onclick = (e) => {
            e.stopPropagation();
            deleteNode(node.id);
          };
          body.appendChild(delBtn);
          block.appendChild(body);

          if (node.type === 'double') {
            const contentEl = body.querySelector('.tag-content');
            if (contentEl) {
              contentEl.addEventListener('input', () => {
                node.content = contentEl
                  .innerText;
                updateCodePreview();
                updateRenderPreview();
              });
              contentEl.addEventListener('blur', () => {
                if (!contentEl.innerText
                  .trim() && node.tagName !== 'style') contentEl.innerText =
                    '内容';
              });
            }
          }
          if ((node.type === 'single' && ['img', 'video', 'audio'].includes(node.tagName)) || node.tagName === 'a') {
            const attrEditors = body.querySelectorAll('.attr-editor');
            attrEditors.forEach(editor => {
              const attrName = editor.dataset.attr;
              if (!attrName) return;
              editor.addEventListener('input', () => {
                node.attributes[attrName] =
                  editor.innerText.trim();
                updateCodePreview();
                updateRenderPreview();
              });
              if (attrName === 'src') {
                editor.classList.add('src-ellipsis');
                editor.addEventListener('focus', () => editor.classList.remove(
                  'src-ellipsis'));
                editor.addEventListener('blur', () => editor.classList.add(
                  'src-ellipsis'));
              }
            });
          }
        }
        return block;
      }

      function buildTagBodyHTML(node) {
        if (node.type === 'double') {
          const name = escapeHTML(node.displayName);
          // 为 a 标签添加 href 属性编辑器
          if (node.tagName === 'a') {
            const href = node.attributes?.href || '';
            return `<span style="opacity:0.7">&lt;${name} <span class="attr-editor" contenteditable="true" data-attr="href" data-placeholder="链接地址">${escapeHTML(href)}</span>&gt;</span><span class="tag-content" contenteditable="true">${escapeHTML(node.content)}</span><span style="opacity:0.7">&lt;/${name}&gt;</span>`;
          }
          return `<span style="opacity:0.7">&lt;${name}&gt;</span><span class="tag-content" contenteditable="true">${escapeHTML(node.content)}</span><span style="opacity:0.7">&lt;/${name}&gt;</span>`;
        }
        if (node.type === 'double') {
          return `<span style="opacity:0.7">&lt;${name}&gt;</span><span class="tag-content" contenteditable="true">${escapeHTML(node.content)}</span><span style="opacity:0.7">&lt;/${name}&gt;</span>`;
        } else if (node.type === 'single') {
          let attrStr = '';
          if (['img', 'video', 'audio'].includes(node.tagName)) {
            const src = node.attributes?.src || '';
            const width = node.attributes?.width || '';
            const height = node.attributes?.height || '';
            attrStr =
              ` <span class="attr-editor" contenteditable="true" data-attr="src" data-placeholder="src">${escapeHTML(src)}</span>`;
            attrStr +=
              ` <span class="attr-editor" contenteditable="true" data-attr="width" data-placeholder="宽">${escapeHTML(width)}</span>`;
            attrStr +=
              ` <span class="attr-editor" contenteditable="true" data-attr="height" data-placeholder="高">${escapeHTML(height)}</span>`;
          }
          return `&lt;${name}${attrStr} /&gt; `;
        } else if (node.type === 'error') {
          if (node.errorType === 'unclosed')
            return `️ &lt;${name}&gt; 缺少闭合!`;
          if (node.errorType === 'missing-bracket')
            return `️ <span style="text-decoration:line-through;">&lt;</span>${name}&gt; 缺尖括号`;
          return `️ &lt;${name}&gt; BUG`;
        }
        return `&lt;${name}&gt;`;
      }

      // ========== 选中逻辑 ==========
      function selectNode(nodeId) {
        document.querySelectorAll('.build-tag-block.selected').forEach(b => b.classList.remove(
          'selected'));
        const block = rootDropZone.querySelector(`[data-node-id="${nodeId}"]`);
        if (block) block.classList.add('selected');
        selectedNodeId = nodeId;
        document.querySelector('.sidebar-tab[data-tab="styles"]').click();
        renderStylePanel();
      }

      function getSelectedNode() {
        return selectedNodeId ? findNodeById(treeData, selectedNodeId) : null;
      }

      function renderStylePanel() {
        const content = document.getElementById('stylePanelContent');
        const node = getSelectedNode();
        if (!node || node.tagName === 'style') {
          content.innerHTML =
            '<p style="color:#959da5;">请选择一个非 style 标签来设置样式</p>';
          return;
        }

        const currentColor = (node.style && node.style['color']) || '#ffffff';
        const currentBg = (node.style && node.style['background-color']) || '#333333';

        let html = `<div><strong>${node.displayName}</strong> 的样式</div>`;

        const fonts = ['Arial', 'Verdana', 'Times New Roman', 'Courier New', 'Georgia',
          'Comic Sans MS', '微软雅黑', '宋体', '楷体', '仿宋', '苹方', '黑体'
        ];
        html +=
          `<div class="style-section"><h4> 文字</h4><div class="style-btn-grid">`;
        fonts.forEach(f => html +=
          `<button class="style-btn" onclick="setStyle('font-family','${f}')">${f}</button>`);
        html +=
          `</div><div class="input-group"><input type="number" id="fontSizeInput" placeholder="字号px" style="width:70px;"><button class="style-btn" onclick="setStyle('font-size', document.getElementById('fontSizeInput').value+'px')">应用</button></div></div>`;

        const presetColors = ['#e06c75', '#98c379', '#61afef', '#c678dd', '#e5c07b', '#56b6c2',
          '#ffffff', '#000000', '#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff922b',
          '#845ef7', '#f06595', '#20c997'
        ];
        html +=
          `<div class="style-section"><h4> 文字颜色</h4><div class="style-btn-grid">`;
        presetColors.forEach(c => html +=
          `<button class="style-btn" onclick="setStyle('color','${c}')"><span class="color-swatch" style="background:${c}"></span>${c}</button>`
        );
        html +=
          `<button class="style-btn" onclick="removeStyle('color')" style="background:#5c3a1e; border-color:#e5c07b; color:#e5c07b;"> 取消文字颜色</button>`;
        html +=
          `</div><div class="color-picker-row"><label> 自定义颜色：</label><input type="color" id="colorPickerText" value="${currentColor}" onchange="setStyle('color', this.value)"><span class="current-color-display" style="background:${currentColor}"></span><span style="font-size:0.7em;color:var(--text-secondary);">${currentColor}</span></div></div>`;

        html +=
          `<div class="style-section"><h4>️ 背景色</h4><div class="style-btn-grid">`;
        presetColors.forEach(c => html +=
          `<button class="style-btn" onclick="setStyle('background-color','${c}')"><span class="color-swatch" style="background:${c}"></span>${c}</button>`
        );
        html +=
          `<button class="style-btn" onclick="removeStyle('background-color')" style="background:#5c3a1e; border-color:#e5c07b; color:#e5c07b;"> 取消背景色</button>`;
        html +=
          `</div><div class="color-picker-row"><label> 自定义颜色：</label><input type="color" id="colorPickerBg" value="${currentBg}" onchange="setStyle('background-color', this.value)"><span class="current-color-display" style="background:${currentBg}"></span><span style="font-size:0.7em;color:var(--text-secondary);">${currentBg}</span></div></div>`;

        html +=
          `<div class="style-section"><h4> 边框</h4><div class="style-btn-grid">`;
        ['1px solid #fff', '2px dashed #61afef', '3px dotted #e5c07b', 'none'].forEach(b => html +=
          `<button class="style-btn" onclick="setStyle('border','${b}')">${b}</button>`);
        html += `</div></div>`;

        const anims = [
          { name: '颜色闪烁', css: 'text-color-change 2s infinite' }, {
            name: '文字放大',
            css: 'text-size-pulse 1s infinite'
          },
          { name: '阴影发光', css: 'text-shadow-glow 1.5s infinite' }, {
            name: '闪烁',
            css: 'text-blink 1s infinite'
          },
          { name: '霓虹闪烁', css: 'neon-flicker 1.5s infinite' }, {
            name: '渐变色流',
            css: 'gradient-flow 3s linear infinite'
          },
          { name: '3D翻转', css: 'flip-3d 2s ease-in-out infinite' }, {
            name: '打字机',
            css: 'typewriter 4s steps(40) 1s 1 normal both'
          },
          { name: '波浪跳动', css: 'wave-jump 0.6s ease-in-out infinite' }, {
            name: '无动画',
            css: ''
          }
        ];
        html +=
          `<div class="style-section"><h4>文字动画</h4><div class="style-btn-grid">`;
        anims.forEach(a => html +=
          `<button class="style-btn" onclick="setAnimation('${a.css}')">${a.name}</button>`);
        html += `</div></div>`;

        html +=
          `<button class="btn" onclick="clearStyles()" style="margin-top:8px;">️ 清除所有样式</button>`;
        content.innerHTML = html;
      }

      window.setStyle = function (prop, value) {
        const node = getSelectedNode();
        if (!node || node.tagName === 'style') return;
        if (!node.style) node.style = {};
        node.style[prop] = value;
        updateStyleNodes();
        renderBuildArea();
        updateCodePreview();
        updateRenderPreview();
        if (prop === 'color') {
          const picker = document.getElementById('colorPickerText'); if (picker) picker
            .value = value;
        }
        if (prop === 'background-color') {
          const picker = document.getElementById('colorPickerBg'); if (picker)
            picker.value = value;
        }
      };

      window.removeStyle = function (prop) {
        const node = getSelectedNode();
        if (!node || node.tagName === 'style') return;
        if (node.style && node.style.hasOwnProperty(prop)) {
          delete node.style[prop];
          updateStyleNodes();
          renderBuildArea();
          updateCodePreview();
          updateRenderPreview();
          renderStylePanel();
          showToast(` 已取消${prop === 'color' ? '文字颜色' : '背景色'}`);
        }
      };

      window.setAnimation = function (css) {
        const node = getSelectedNode();
        if (!node || node.tagName === 'style') return;
        if (!node.animClassPrefix) {
          node.animClassPrefix = 'anim-' + randomString(8);
        }
        node.animClass = css;
        updateStyleNodes();
        renderBuildArea();
        updateCodePreview();
        updateRenderPreview();
      };
      window.clearStyles = function () {
        const node = getSelectedNode();
        if (!node || node.tagName === 'style') return;
        node.style = {};
        node.animClass = '';
        node.animClassPrefix = null;
        updateStyleNodes();
        renderBuildArea();
        updateCodePreview();
        updateRenderPreview();
      };

      // ========== 预设模板 ==========
      const presets = [
        // ========== 原有12个（已加姓名栏 & 配色优化） ==========
        {
          name: ' 冰晶磨砂',
          desc: '高透磨砂玻璃，轻盈通透',
          build: function () {
            const data = [];
            nodeIdCounter = 0;
            const html = createNode('html', 'container', 'html');
            const head = createNode('head', 'container', 'head');
            const title = createNode('title', 'double', 'title');
            title.content = '冰晶卡片';
            const style = createNode('style', 'double', 'style');
            style.content = '';
            const body = createNode('body', 'container', 'body');
            const card = createNode('div', 'container', 'div');
            const h1 = createNode('h1', 'double', 'h1');
            h1.content = ' 你的名字';
            const name = createNode('p', 'double', 'p');          // 新增姓名栏
            name.content = ' 姓名：';
            const classInfo = createNode('p', 'double', 'p');
            classInfo.content = ' 班级：';
            const group = createNode('p', 'double', 'p');
            group.content = ' 小组：';
            const hobby = createNode('p', 'double', 'p');
            hobby.content = ' 爱好：';
            const motto = createNode('p', 'double', 'p');
            motto.content = ' 座右铭：';
            head.children.push(title, style);
            card.children.push(h1, name, classInfo, group, hobby, motto);
            body.children.push(card);
            html.children.push(head, body);
            data.push(html);

            card.style = {
              'background': 'radial-gradient(circle at top left, rgba(255,255,255,0.85), rgba(255,255,255,0.25))',
              'backdrop-filter': 'blur(28px) saturate(130%)',
              '-webkit-backdrop-filter': 'blur(28px) saturate(130%)',
              'border-radius': '32px',
              'padding': '40px 48px',
              'text-align': 'center',
              'box-shadow': '0 20px 50px rgba(0,0,0,0.08), inset 0 0 0 1px rgba(255,255,255,0.6)',
              'border': '1px solid rgba(255,255,255,0.4)',
              'min-width': '260px'
            };
            h1.style = { 'font-size': '2em', 'color': '#1e293b', 'font-weight': '700', 'margin': '0 0 16px 0', 'letter-spacing': '0.5px', 'font-family': 'system-ui, -apple-system, sans-serif' };
            [name, classInfo, group, hobby, motto].forEach(p => {
              p.style = { 'font-size': '0.95em', 'color': '#475569', 'margin': '10px 0', 'font-weight': '500' };
            });
            card.animClass = 'soft-float 4s ease-in-out infinite';
            card.animClassPrefix = 'anim-' + randomString(8);

      window.loadPreset = function (index) {
        const preset = presets[index];
        if (!preset) return;
        treeData.length = 0;
        nodeIdCounter = 0;
        selectedNodeId = null;
        const newTree = preset.build();
        treeData.splice(0, treeData.length, ...newTree);
        updateStyleNodes();
        renderBuildArea();
        document.querySelector('.sidebar-tab[data-tab="tags"]').click();
        showToast(` 已加载预设：${preset.name}`);
      };

      renderPresetsPanel();

      // ========== 数据操作 ==========
      function findNodeAndParent(nodes, targetId, parent = null) {
        for (let i = 0; i < nodes.length; i++) {
          if (nodes[i].id === targetId) return { parent, node: nodes[i], index: i, list: nodes };
          if (nodes[i].children) {
            const res = findNodeAndParent(nodes[i].children, targetId, nodes[i]);
            if (res) return res;
          }
        }
        return null;
      }

      function findNodeById(nodes, id) {
        for (const n of nodes) {
          if (n.id === id) return n;
          if (n.children) { const f = findNodeById(n.children, id); if (f) return f; }
        }
        return null;
      }

      function deleteNode(nodeId) {
        if (selectedNodeId === nodeId) {
          selectedNodeId = null;
          document.getElementById('panel-styles').classList.remove('active');
          document.getElementById('panel-tags').classList.add('active');
          document.querySelector('.sidebar-tab[data-tab="tags"]').classList.add('active');
          document.querySelector('.sidebar-tab[data-tab="styles"]').classList.remove('active');
        }
        const res = findNodeAndParent(treeData, nodeId);
        if (!res) return;
        res.list.splice(res.index, 1);
        renderBuildArea();
        showToast('️ 已删除');
      }

      function addTagToRoot(tag, type, display, error = null) {
        treeData.push(createNode(tag, type, display, error));
        renderBuildArea();
        showToast(` 已添加 <${display}>`);
      }

      function addNodeToContainer(container, tag, type, display, error = null) {
        if (!container.children) container.children = [];
        container.children.push(createNode(tag, type, display, error));
        renderBuildArea();
      }

      // ========== 拖放接收 ==========
      rootDropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        const targetBlock = e.target.closest('.build-tag-block');
        const targetChildren = e.target.closest('.container-children');
        document.querySelectorAll(
          '.drop-highlight-above, .drop-highlight-below, .drop-highlight-inside')
          .forEach(el => el.classList.remove('drop-highlight-above', 'drop-highlight-below',
            'drop-highlight-inside'));
        if (targetChildren && !targetBlock) {
          targetChildren.classList.add('drop-highlight-inside');
        } else if (targetBlock) {
          const rect = targetBlock.getBoundingClientRect();
          const mouseY = e.clientY,
            midY = rect.top + rect.height / 2;
          const nodeId = parseInt(targetBlock.dataset.nodeId);
          const node = findNodeAndParent(treeData, nodeId)?.node;
          if (node && node.type === 'container') {
            const threshold = rect.height * 0.3;
            if (mouseY > midY - threshold && mouseY < midY + threshold) {
              const area = targetBlock.querySelector('.container-children');
              if (area) area.classList.add('drop-highlight-inside');
            } else if (mouseY < midY) targetBlock.classList.add('drop-highlight-above');
            else targetBlock.classList.add('drop-highlight-below');
          } else {
            if (mouseY < midY) targetBlock.classList.add('drop-highlight-above');
            else targetBlock.classList.add('drop-highlight-below');
          }
        } else {
          rootDropZone.classList.add('drag-over');
        }
      });

      rootDropZone.addEventListener('dragleave', (e) => {
        if (e.target === rootDropZone) {
          rootDropZone.classList.remove('drag-over');
          document.querySelectorAll(
            '.drop-highlight-above, .drop-highlight-below, .drop-highlight-inside')
            .forEach(el => el.classList.remove('drop-highlight-above', 'drop-highlight-below',
              'drop-highlight-inside'));
        }
      });

      rootDropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        rootDropZone.classList.remove('drag-over');
        document.querySelectorAll(
          '.drop-highlight-above, .drop-highlight-below, .drop-highlight-inside')
          .forEach(el => el.classList.remove('drop-highlight-above', 'drop-highlight-below',
            'drop-highlight-inside'));
        const json = e.dataTransfer.getData('application/json');
        if (!json) return;
        let data;
        try { data = JSON.parse(json); } catch (ex) { return; }
        if (data.source !== 'library') return;

        const targetBlock = e.target.closest('.build-tag-block');
        const targetChildren = e.target.closest('.container-children');
        if (targetChildren && !targetBlock) {
          const parentId = parseInt(targetChildren.dataset.parentNodeId);
          const parentNode = findNodeAndParent(treeData, parentId)?.node;
          if (parentNode && parentNode.type === 'container') {
            addNodeToContainer(parentNode, data.tag, data.type, data.display, data.error);
            showToast(` 放入 <${parentNode.displayName}> 内部`);
          }
        } else if (targetBlock) {
          const targetNodeId = parseInt(targetBlock.dataset.nodeId);
          const targetNode = findNodeAndParent(treeData, targetNodeId)?.node;
          if (!targetNode) return;
          const rect = targetBlock.getBoundingClientRect();
          const mouseY = e.clientY,
            midY = rect.top + rect.height / 2;
          let intoContainer = false;
          if (targetNode.type === 'container') {
            const threshold = rect.height * 0.3;
            if (mouseY > midY - threshold && mouseY < midY + threshold) intoContainer = true;
          }
          if (intoContainer) {
            addNodeToContainer(targetNode, data.tag, data.type, data.display, data.error);
            showToast(` 放入 <${targetNode.displayName}> 内部`);
          } else {
            const targetRes = findNodeAndParent(treeData, targetNodeId);
            if (targetRes) {
              const list = targetRes.parent ? targetRes.parent.children : treeData;
              const idx = mouseY < midY ? targetRes.index : targetRes.index + 1;
              list.splice(idx, 0, createNode(data.tag, data.type, data.display, data
                .error));
              renderBuildArea();
              showToast(` 插入标签`);
            }
          }
        } else {
          addTagToRoot(data.tag, data.type, data.display, data.error);
        }
      });

      // ========== 代码预览与渲染 ==========
      function updateCodePreview() {
        const lines = [];
        if (!treeData.length) { lines.push('// 拖拽标签开始构建'); } else {
          treeData.forEach(n =>
            generateCodeLines(n, lines, 0));
        }
        codePreview.innerHTML = lines.map((l, i) =>
          `<span style="color:#4a5568;">${i + 1}</span>  ${l}`).join('\n');
      }

      function generateCodeLines(node, lines, indent) {
        const pad = '  '.repeat(indent);
        const cls = getNodeClasses(node);
        const classAttr = cls ? ` class="${cls}"` : '';
        if (node.type === 'container') {
          lines.push(
            `${pad}<span style="color:#61afef;">&lt;${escapeHTML(node.displayName)}${classAttr}&gt;</span>`
          );
          if (node.children && node.children.length) {
            node.children.forEach(c =>
              generateCodeLines(c, lines, indent + 1));
          } else {
            lines.push(
              `${pad}  <span style="color:#5c6370;">&lt;!-- 空 --&gt;</span>`);
          }
          lines.push(
            `${pad}<span style="color:#61afef;">&lt;/${escapeHTML(node.displayName)}&gt;</span>`);
        } else if (node.type === 'double') {
          let extraAttr = '';
          if (node.tagName === 'a' && node.attributes?.href) extraAttr += ` href="${escapeHTML(node.attributes.href)}"`;
          if (node.tagName === 'style') {
            lines.push(`${pad}<span style="color:#e5c07b;">&lt;style&gt;</span>`);
            if (node.content) {
              node.content.split('\n').forEach(line => lines.push(
                `${pad}  ${escapeHTML(line)}`));
            }
            lines.push(`${pad}<span style="color:#e5c07b;">&lt;/style&gt;</span>`);
          } else {
            lines.push(
              `${pad}<span style="color:#56b6c2;">&lt;${escapeHTML(node.displayName)}${classAttr}&gt;</span>${escapeHTML(node.content)}<span style="color:#56b6c2;">&lt;/${escapeHTML(node.displayName)}&gt;</span>`
            );
          }
        } else if (node.type === 'single') {
          let attr = '';
          if (node.attributes?.src) attr += ` src="${escapeHTML(node.attributes.src)}"`;
          if (node.attributes?.width) attr += ` width="${escapeHTML(node.attributes.width)}"`;
          if (node.attributes?.height) attr += ` height="${escapeHTML(node.attributes.height)}"`;
          lines.push(
            `${pad}<span style="color:#e5c07b;">&lt;${escapeHTML(node.displayName)}${attr}${classAttr} /&gt;</span>`
          );
        } else if (node.type === 'error') {
          lines.push(
            `${pad}<span style="color:#e06c75;">&lt;${escapeHTML(node.displayName)}${classAttr}&gt;</span> `
          );
        }
      }

      function getRenderHTML() {
        const usedAnimNames = new Set();

        function collectAnimNames(nodes) {
          for (const n of nodes) {
            if (n.animClass) {
              const animPart = n.animClass.split(',');
              animPart.forEach(part => {
                const name = part.trim().split(' ')[0];
                if (name) usedAnimNames.add(name);
              });
            }
            if (n.children) collectAnimNames(n.children);
          }
        }
        collectAnimNames(treeData);

        let keyframesCSS = '';
        usedAnimNames.forEach(name => { if (KEYFRAMES[name]) keyframesCSS += KEYFRAMES[name] + '\n'; });

        let styleContent = '';
        findStyleNodes(treeData).forEach(s => { if (s.content) styleContent += s.content + '\n'; });
        const allRules = getAllCSSRules();
        if (!styleContent && allRules.length) { styleContent = allRules.join('\n'); }

        let fullStyle = '';
        if (keyframesCSS) fullStyle += keyframesCSS + '\n';
        if (styleContent.trim()) fullStyle += styleContent + '\n';

        let styleTag = '';
        if (fullStyle.trim()) { styleTag = `<style>\n${fullStyle}\n</style>\n`; }

        const bodyLines = [];
        treeData.forEach(n => { if (n.tagName !== 'style') renderPlainLines(n, bodyLines, 0); });
        return `<!DOCTYPE html><html><head><meta charset="UTF-8">${styleTag}</head><body>${bodyLines.join('\n')}</body></html>`;
      }

      function renderPlainLines(node, lines, indent) {
        const pad = '  '.repeat(indent);
        const cls = getNodeClasses(node);
        const classAttr = cls ? ` class="${cls}"` : '';
        if (node.type === 'container') {
          lines.push(`${pad}<${node.displayName}${classAttr}>`);
          if (node.children) node.children.forEach(c => renderPlainLines(c, lines, indent + 1));
          lines.push(`${pad}</${node.displayName}>`);
        } else if (node.type === 'double') {
          if (node.tagName === 'style') return;
          let extraAttr = '';
          if (node.tagName === 'a' && node.attributes?.href) extraAttr += ` href="${node.attributes.href}"`;
          lines.push(`${pad}<${node.displayName}${extraAttr}${classAttr}>${node.content}</${node.displayName}>`);
        } else if (node.type === 'single') {
          let attr = '';
          if (node.attributes?.src) attr += ` src="${node.attributes.src}"`;
          if (node.attributes?.width) attr += ` width="${node.attributes.width}"`;
          if (node.attributes?.height) attr += ` height="${node.attributes.height}"`;
          lines.push(`${pad}<${node.displayName}${attr}${classAttr} />`);
        } else {
          lines.push(`${pad}<${node.displayName}${classAttr}>`);
        }
      }

      function updateRenderPreview() {
        const html = getRenderHTML();
        const doc = renderFrame.contentDocument || renderFrame.contentWindow.document;
        doc.open();
        doc.write(html);
        doc.close();
      }

      // ========== 复制功能 ==========
      function copyCode() {
        const html = getRenderHTML();
        navigator.clipboard.writeText(html).then(() => showToast(' 完整代码已复制'));
      }

      function findBodyNode(nodes) {
        for (const n of nodes) {
          if (n.tagName === 'body') return n;
          if (n.children) {
            const found = findBodyNode(n.children);
            if (found) return found;
          }
        }
        return null;
      }

      function copyBodyHTML() {
        const bodyNode = findBodyNode(treeData);
        if (!bodyNode) {
          showToast('️ 未找到 body 标签', 'warning-toast');
          return;
        }
        if (!bodyNode.children || bodyNode.children.length === 0) {
          showToast('️ body 中暂无内容', 'warning-toast');
          return;
        }
        const bodyLines = [];
        bodyNode.children.forEach(child => renderPlainLines(child, bodyLines, 0));
        const bodyHTML = bodyLines.join('\n');
        navigator.clipboard.writeText(bodyHTML).then(() => showToast(' 已复制 body 内部 HTML'));
      }

      function copyStyleCSS() {
        // 1. 收集当前树中所有被使用的动画名称
        const usedAnimNames = new Set();
        function collectAnimNames(nodes) {
          for (const n of nodes) {
            if (n.animClass) {
              // 动画属性可能包含多个值（备用），取第一个动画名称
              const animPart = n.animClass.split(',');
              animPart.forEach(part => {
                const name = part.trim().split(' ')[0];
                if (name) usedAnimNames.add(name);
              });
            }
            if (n.children) collectAnimNames(n.children);
          }
        }
        collectAnimNames(treeData);

        // 2. 构建完整的 CSS 内容
        let cssContent = '';

        // 添加所有被使用的 @keyframes 定义
        usedAnimNames.forEach(name => {
          if (KEYFRAMES[name]) {
            cssContent += KEYFRAMES[name] + '\n';
          }
        });

        // 添加 <style> 标签中已有的内容（包括手动编写的规则）
        findStyleNodes(treeData).forEach(s => {
          if (s.content && s.content.trim()) {
            cssContent += s.content + '\n';
          }
        });

        // 3. 如果没有 <style> 标签或其为空，则补充自动生成的样式规则（来自样式面板）
        const hasStyleContent = findStyleNodes(treeData).some(s => s.content && s.content.trim());
        if (!hasStyleContent) {
          const allRules = getAllCSSRules(); // 包含 .cla-* 和 .anim-* 规则
          if (allRules.length) {
            cssContent += allRules.join('\n') + '\n';
          }
        }

        // 4. 若最终仍为空，显示占位文本
        if (!cssContent.trim()) {
          cssContent = '/* 暂无 CSS 样式 */';
        }

        navigator.clipboard.writeText(cssContent.trim()).then(() => showToast(' 已复制 CSS 样式（含关键帧）'));
      }

      window.copyCode = copyCode;
      window.copyBodyHTML = copyBodyHTML;
      window.copyStyleCSS = copyStyleCSS;

      function loadExample() {
        treeData.length = 0;
        nodeIdCounter = 0;
        selectedNodeId = null;
        const html = createNode('html', 'container', 'html');
        const head = createNode('head', 'container', 'head');
        const title = createNode('title', 'double', 'title');
        title.content = '我的网页';
        const style = createNode('style', 'double', 'style');
        style.content = '';
        const body = createNode('body', 'container', 'body');
        const p = createNode('p', 'double', 'p');
        p.content = '你好，世界！';
        head.children.push(title, style);
        body.children.push(p);
        html.children.push(head, body);
        treeData.push(html);
        updateStyleNodes();
        renderBuildArea();
        document.querySelector('.sidebar-tab[data-tab="tags"]').click();
        showToast('已加载');
      }

      function clearAll() {
        treeData.length = 0;
        nodeIdCounter = 0;
        selectedNodeId = null;
        renderBuildArea();
        document.querySelector('.sidebar-tab[data-tab="tags"]').click();
        showToast('已清空');
      }

      window.loadExample = loadExample;
      window.clearAll = clearAll;
      window.addTagToRoot = addTagToRoot;

      // ========== 标签帮助弹窗逻辑 ==========
      function buildHelpCards(filterCategory = 'all') {
        const body = document.getElementById('helpModalBody');
        const filtered = filterCategory === 'all' ?
          helpData :
          helpData.filter(h => h.category === filterCategory);

        body.innerHTML = filtered.map(h => {
          const badgeClass = 'badge-' + h.category;
          const tagBadgeClass = 'tag-badge-' + h.category;
          return `
                <div class="help-card">
                    <div class="help-card-header">
                        <span class="help-tag-name ${tagBadgeClass}">&lt;${escapeHTML(h.display)}&gt;</span>
                        <span class="help-type-badge ${badgeClass}">${getCategoryLabel(h.category)}</span>
                    </div>
                    <div class="help-desc">${h.desc}</div>
                    <div class="help-demo-area">${h.demoHTML}</div>
                </div>`;
        }).join('');
      }

      function getCategoryLabel(cat) {
        const map = { container: '容器', double: '双标签', single: '单标签', error: 'Bug' };
        return map[cat] || cat;
      }

      function openHelpModal() {
        const overlay = document.getElementById('helpModalOverlay');
        buildHelpCards('all');
        // 重置筛选按钮
        document.querySelectorAll('#helpFilterRow .modal-filter-btn').forEach(b => b.classList.remove(
          'active'));
        const allBtn = document.querySelector('#helpFilterRow .modal-filter-btn[data-filter="all"]');
        if (allBtn) allBtn.classList.add('active');
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
      }

      function closeHelpModal() {
        const overlay = document.getElementById('helpModalOverlay');
        overlay.classList.remove('active');
        document.body.style.overflow = '';
      }

      // 绑定筛选按钮
      document.getElementById('helpFilterRow').addEventListener('click', (e) => {
        const btn = e.target.closest('.modal-filter-btn');
        if (!btn) return;
        const filter = btn.dataset.filter;
        document.querySelectorAll('#helpFilterRow .modal-filter-btn').forEach(b => b.classList
          .remove('active'));
        btn.classList.add('active');
        buildHelpCards(filter);
      });

      // 点击背景关闭弹窗
      document.getElementById('helpModalOverlay').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) {
          closeHelpModal();
        }
      });

      // ESC 关闭弹窗
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          const overlay = document.getElementById('helpModalOverlay');
          if (overlay.classList.contains('active')) {
            closeHelpModal();
          }
        }
      });

      // 暴露到全局
      window.openHelpModal = openHelpModal;
      window.closeHelpModal = closeHelpModal;

      // ========== 初始化 ==========
      loadExample();
    })();
  </script>
</body>
